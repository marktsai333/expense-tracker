<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#1a9b9e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="記帳" />
  <title>記帳｜手機版</title>
  <style>
    html, body { width:100%; height:100%; min-height:100%; margin:0; overflow:hidden; background:#eef1f2; }
    #phoneLoading { display:grid; min-height:100%; place-items:center; color:#82909a; font:14px -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif; }
  </style>
</head>
<body>
  <div id="phoneLoading">載入手機版…</div>
  <script>
    (async () => {
      const loading = document.getElementById('phoneLoading');
      try {
        const response = await fetch('./combined-demo.html?phoneRev=v10', { cache: 'no-store' });
        if (!response.ok) throw new Error(`demo source ${response.status}`);
        let source = await response.text();
        const mobileHead = [
          '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">',
          '<meta name="theme-color" content="#1a9b9e">',
          '<meta name="apple-mobile-web-app-capable" content="yes">',
          '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">',
          '<meta name="apple-mobile-web-app-title" content="記帳">',
        ].join('');
        const runtimeTag = '<script src="phone-runtime-v10.js"><' + '/script>';
        source = source.replace(/<\/head>/i, `${mobileHead}</head>`);
        source = source.replace(/<\/body>/i, `${runtimeTag}</body>`);
        document.open();
        document.write(source);
        document.close();
      } catch (loadError) {
        if (loading) loading.textContent = '手機版無法載入。請確認網路後重新開啟 App。';
        console.error(loadError);
      }
    })();
  </script>
</body>
</html>
