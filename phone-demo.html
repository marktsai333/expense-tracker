<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#1a9b9e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="記帳" />
  <title>記帳 Demo｜手機入口</title>
  <style>
    :root { color-scheme: light; }
    html, body { width: 100%; height: 100%; min-height: 100%; min-height: 100dvh; margin: 0; overflow: hidden; background: #eef1f2; }
    #demoFrame { display: block; width: 100%; height: 100%; height: 100dvh; min-height: 100%; min-height: 100dvh; border: 0; }
    #loadError { display: none; padding: 24px; color: #1c2226; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; }
  </style>
</head>
<body>
  <iframe id="demoFrame" title="記帳整合 Demo" src="combined-demo.html?phoneRev=latest"></iframe>
  <div id="loadError">
    無法載入整合 Demo。這個手機入口需要透過 HTTP 伺服器開啟，不能直接用 <code>file://</code> 載入 iframe。<br />
    <a href="./phone-demo.html?latest=1">開啟 HTTP 版本</a>
  </div>
  <script>
    // Keep one canonical phone-preview URL. Older rev=... links are redirected
    // here so a stale browser tab cannot be mistaken for the current build.
    if ((location.protocol === 'http:' || location.protocol === 'https:') && new URLSearchParams(location.search).get('latest') !== '1') {
      const canonicalUrl = new URL('./phone-demo.html?latest=1', location.href);
      location.replace(canonicalUrl.href);
    }

    const frame = document.getElementById('demoFrame');
    const error = document.getElementById('loadError');

    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        if (!doc) throw new Error('Demo document unavailable');

        // This stylesheet belongs only to this phone entry point. The approved
        // combined-demo.html file is never edited.
        const style = doc.createElement('style');
        style.textContent = `
          html, body { width:100% !important; height:100% !important; min-height:100% !important; margin:0 !important; padding:0 !important; overflow:hidden !important; background:var(--bg) !important; overscroll-behavior-y:none !important; }
          body { display:block !important; }
          html, body, .device-frame, .device-screen, .phone, .screen, button, a, label, .tab, .account-row, .swipe-wrap { -webkit-user-select:none !important; user-select:none !important; -webkit-touch-callout:none !important; }
          input, textarea, select, [contenteditable="true"] { -webkit-user-select:text !important; user-select:text !important; -webkit-touch-callout:default !important; }
          .toolbar { display:none !important; }
          .device-frame { width:100vw !important; height:100% !important; height:100dvh !important; min-height:100% !important; min-height:100dvh !important; margin:0 !important; padding:0 !important; border-radius:0 !important; background:var(--bg) !important; box-shadow:none !important; }
          .device-screen { width:100% !important; height:100% !important; border-radius:0 !important; background:var(--bg) !important; }
          .dynamic-island, .status-bar, .home-indicator { display:none !important; }
          /* The phone entry point owns the screen geometry. Keep the approved
             62px top rhythm, but reserve one 84px content-clearance band for
             the visible bottom capsule; do not add a second bottom safe-area
             offset to the capsule itself. */
          .phone { padding-top:max(62px, var(--phone-safe-top, env(safe-area-inset-top, 0px))) !important; padding-bottom:84px !important; background:transparent !important; overscroll-behavior-y:none !important; }
          .screen.visible { background:var(--bg) !important; }
          .device-screen::before { content:""; position:absolute; z-index:0; top:0; right:0; left:0; height:max(62px, var(--phone-safe-top, env(safe-area-inset-top, 0px))); background:var(--accent) !important; pointer-events:none; }
          .device-screen[data-phone-surface="overview"]::before { background:var(--accent) !important; }
          .device-screen[data-phone-surface="me"]::before { background:#44adb5 !important; }
          .device-screen[data-phone-surface="neutral"]::before { background:var(--bg) !important; }
          .phone { z-index:1 !important; }
          /* Keep the capsule's approved 340×70 size, but remove the extra
             84px centering band that was lifting it away from the bottom. */
          .safe-zone { bottom:16px !important; height:70px !important; align-items:flex-end !important; }
          .safe-zone.phone-sheet-open { display:none !important; }
          .tabbar { bottom:auto !important; }
          .fab { bottom:92px !important; }
          /* Long pages keep the same clearance as the short overview. The
             capsule's vertical position is independent from this padding. */
          /* Normal state: use the approved translucent glass treatment so the
             capsule stays visually light while the user is interacting. */
          .safe-zone .tabbar {
            background:rgba(255,255,255,.18) !important;
            border-color:rgba(255,255,255,.42) !important;
            backdrop-filter:blur(24px) saturate(180%) !important;
            -webkit-backdrop-filter:blur(24px) saturate(180%) !important;
            box-shadow:0 8px 30px rgba(15,24,28,.22), inset 0 1px 0 rgba(255,255,255,.42) !important;
          }
          /* Idle state: fade the material further instead of switching to an
             opaque white bar; this keeps the page visible underneath. */
          .safe-zone.nav-idle .tabbar {
            background:rgba(255,255,255,.08) !important;
            border-color:rgba(255,255,255,.28) !important;
            backdrop-filter:blur(28px) saturate(160%) !important;
            -webkit-backdrop-filter:blur(28px) saturate(160%) !important;
            box-shadow:0 8px 26px rgba(15,24,28,.14), inset 0 1px 0 rgba(255,255,255,.28) !important;
          }
          .safe-zone.nav-idle .tab:not(.active) { color:color-mix(in srgb,var(--muted) 72%,var(--text) 28%) !important; opacity:.62 !important; }
          .safe-zone.nav-idle .tab.active { color:var(--accent) !important; opacity:.78 !important; }
          .safe-zone.nav-idle .indicator { opacity:.72 !important; }
          /* The normal details page starts below the outer 62px status
             surface. A search overlay is full-screen, so its host page must
             temporarily rise into that surface instead of leaving a grey
             strip above the teal search header. */
          #pageList.phone-search-open { top:0 !important; }
          #mySheet { overscroll-behavior:contain !important; }
          #mySheet .my-sheet-scroll { scroll-behavior:auto !important; }
          .settings-list-phone-reorder .swipe-action { visibility:hidden !important; pointer-events:none !important; }
          .settings-list-phone-reorder .reorder-row.dragging { z-index:5 !important; }
        `;
        doc.head.appendChild(style);

        // Replace only the settings-page gesture wiring inside this phone
        // entry point. The approved combined-demo source remains untouched;
        // its existing renderer is reused, while this runtime layer gives
        // reorder and swipe-to-delete separate gesture ownership.
        const settingsScript = doc.createElement('script');
        settingsScript.dataset.phoneSettings = 'true';
        settingsScript.textContent = String.raw`
          (() => {
            if (window.__phoneSettingsReorderInstalled) return;
            window.__phoneSettingsReorderInstalled = true;

            const list = document.getElementById('settingsList');
            if (!list || typeof renderSettingsList !== 'function') return;

            const reducedMotion = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
            const rowsFor = (container) => Array.from(container.querySelectorAll('.reorder-row'));

            function moveGroupAccounts(groupIds, orderedIds) {
              const groupSet = new Set(groupIds);
              const firstIndex = accounts.findIndex((account) => groupSet.has(account.id));
              if (firstIndex < 0) return;
              const remaining = accounts.filter((account) => !groupSet.has(account.id));
              let insertionIndex = 0;
              for (let index = 0; index < firstIndex; index += 1) {
                if (!groupSet.has(accounts[index].id)) insertionIndex += 1;
              }
              const groupAccounts = orderedIds
                .map((id) => accounts.find((account) => account.id === id))
                .filter(Boolean);
              accounts.splice(0, accounts.length,
                ...remaining.slice(0, insertionIndex),
                ...groupAccounts,
                ...remaining.slice(insertionIndex));
            }

            function wirePhoneReorder(container) {
              if (container.dataset.phoneReorderBound === 'true') return;
              container.dataset.phoneReorderBound = 'true';
              const rows = rowsFor(container);
              if (!rows.length) return;
              container.classList.add('settings-list-phone-reorder');
              let drag = null;

              const clearPresentation = () => {
                rows.forEach((row) => {
                  const target = row.closest('.swipe-wrap') || row;
                  row.style.transform = '';
                  row.style.zIndex = '';
                  row.style.scale = '';
                  row.style.opacity = '';
                  row.style.boxShadow = '';
                  row.style.transition = '';
                  row.classList.remove('dragging');
                  if (target !== row) {
                    target.style.transform = '';
                    target.style.zIndex = '';
                    target.style.transition = '';
                    target.style.overflow = '';
                  }
                });
                container.classList.remove('settings-list-phone-reorder');
              };

              const animateCancel = (current) => {
                if (!current) return;
                if (reducedMotion()) {
                  clearPresentation();
                  return;
                }
                let position = current.dy;
                let velocity = 0;
                let last = performance.now();
                const step = (now) => {
                  const dt = Math.min(0.032, Math.max(0.008, (now - last) / 1000));
                  last = now;
                  const acceleration = (-520 * position) - (34 * velocity);
                  velocity += acceleration * dt;
                  position += velocity * dt;
                  current.target.style.transform = 'translate3d(0,' + position + 'px,0)';
                  if (Math.abs(position) < 0.25 && Math.abs(velocity) < 8) {
                    clearPresentation();
                    return;
                  }
                  requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
              };

              const finish = (event, cancelled) => {
                if (!drag || (event && event.pointerId !== drag.pointerId)) return;
                const current = drag;
                // Releasing pointer capture can emit lostpointercapture after
                // pointerup. Mark the gesture as finished before releasing so
                // iPhone cannot run the commit and cancel paths together.
                if (current.finishing) return;
                current.finishing = true;
                drag = null;
                if (event && current.handle.hasPointerCapture?.(event.pointerId)) {
                  current.handle.releasePointerCapture(event.pointerId);
                }
                if (cancelled) {
                  animateCancel(current);
                  return;
                }
                const orderedIds = current.ids.slice();
                const moved = orderedIds.splice(current.origin, 1)[0];
                orderedIds.splice(current.index, 0, moved);
                if (current.index !== current.origin) {
                  moveGroupAccounts(current.ids, orderedIds);
                  clearPresentation();
                  renderSettingsList();
                  renderAccountList();
                } else {
                  clearPresentation();
                }
              };

              // Capture-phase listeners run before the old row listeners in
              // the approved Demo, so a reorder cannot also reveal delete.
              container.addEventListener('pointerdown', (event) => {
                const handle = event.target.closest?.('.drag-handle');
                if (!handle) return;
                const row = handle.closest('.reorder-row');
                const currentRows = rowsFor(container);
                const origin = currentRows.indexOf(row);
                if (!row || origin < 0) return;
                event.preventDefault();
                event.stopPropagation();
                const rects = currentRows.map((item) => item.getBoundingClientRect());
                drag = {
                  handle,
                  row,
                  target: row.closest('.swipe-wrap') || row,
                  pointerId: event.pointerId,
                  startY: event.clientY,
                  dy: 0,
                  origin,
                  index: origin,
                  ids: currentRows.map((item) => item.dataset.id),
                  rects,
                  centers: rects.map((rect) => rect.top + rect.height / 2),
                  finishing: false,
                };
                container.classList.add('settings-list-phone-reorder');
                row.classList.add('dragging');
                row.style.zIndex = '5';
                row.style.scale = '1.02';
                row.style.opacity = '.98';
                row.style.boxShadow = '0 12px 24px rgba(0,0,0,.18)';
                currentRows.forEach((item) => {
                  const target = item.closest('.swipe-wrap') || item;
                  target.style.transition = reducedMotion() ? 'none' : 'transform 180ms cubic-bezier(.22,.61,.36,1)';
                });
                current.target.style.zIndex = '5';
                current.target.style.overflow = 'visible';
                closeAllSwipes?.(container);
                handle.setPointerCapture?.(event.pointerId);
              }, true);

              container.addEventListener('pointermove', (event) => {
                if (!drag || event.pointerId !== drag.pointerId) return;
                event.preventDefault();
                event.stopPropagation();
                const current = drag;
                current.dy = event.clientY - current.startY;
                const center = current.centers[current.origin] + current.dy;
                let next = current.origin;
                if (current.dy > 0) {
                  while (next + 1 < current.centers.length && center > current.centers[next + 1]) next += 1;
                } else if (current.dy < 0) {
                  while (next > 0 && center < current.centers[next - 1]) next -= 1;
                }
                current.index = next;
                current.target.style.transform = 'translate3d(0,' + current.dy + 'px,0)';
                const downStep = current.origin < current.centers.length - 1
                  ? current.rects[current.origin + 1].top - current.rects[current.origin].top
                  : current.rects[current.origin].height;
                const upStep = current.origin > 0
                  ? current.rects[current.origin].top - current.rects[current.origin - 1].top
                  : current.rects[current.origin].height;
                rowsFor(container).forEach((item, index) => {
                  if (item === current.row) return;
                  const target = item.closest('.swipe-wrap') || item;
                  let shift = 0;
                  if (current.origin < current.index && index > current.origin && index <= current.index) shift = -downStep;
                  if (current.origin > current.index && index >= current.index && index < current.origin) shift = upStep;
                  target.style.transform = shift ? 'translate3d(0,' + shift + 'px,0)' : '';
                });
              }, true);

              container.addEventListener('pointerup', (event) => {
                if (!drag || event.pointerId !== drag.pointerId) return;
                event.preventDefault();
                event.stopPropagation();
                finish(event, false);
              }, true);
              container.addEventListener('pointercancel', (event) => finish(event, true), true);
              container.addEventListener('lostpointercapture', (event) => {
                if (drag && event.pointerId === drag.pointerId) finish(event, true);
              }, true);
            }

            const originalRender = renderSettingsList;
            renderSettingsList = function phoneRenderSettingsList() {
              originalRender();
              // The approved renderer installs its own anonymous drag listeners.
              // Clone each group before wiring the phone layer so those listeners
              // cannot race with the phone reorder controller. Swipe-to-delete is
              // reattached explicitly below and remains available on normal rows.
              document.querySelectorAll('#settingsList .bank-group').forEach((group) => {
                const cleanGroup = group.cloneNode(true);
                group.replaceWith(cleanGroup);
                wirePhoneReorder(cleanGroup);
                if (typeof wireSwipeDelete === 'function') wireSwipeDelete(cleanGroup);
              });
            };
            renderSettingsList();
            try {
              const settingsObserver = new MutationObserver(() => {
                document.querySelectorAll('#settingsList .bank-group').forEach(wirePhoneReorder);
              });
              if (list && typeof list.nodeType === 'number') {
                settingsObserver.observe(list, { childList:true, subtree:true });
              }
            } catch {
              // The renderer already wires the current rows; an observer is
              // only an enhancement for later list rebuilds.
            }

            // The approved book editor schedules an automatic focus on the name
            // field. Safari may scroll the embedded document to reveal that field,
            // which is the small jump seen when opening 「帳本設定」. Keep the
            // exact approved editor markup, but remove that implicit focus: the
            // user can focus the field explicitly without moving the sheet.
            if (typeof openBookNameSheet === 'function') {
              openBookNameSheet = function phoneOpenBookNameSheet(category) {
                const editing = category
                  ? myState.categories.find((item) => item.id === category)
                  : { id:'book', name:myState.bookName, icon:myState.bookIcon, color:myState.bookColor, isBook:true };
                if (!editing) return;
                const target = editing.isBook ? 'book' : 'category';
                const iconChoices = editing.isBook ? MY_BOOK_ICONS : MY_CATEGORY_ICONS;
                const colorChoices = [...new Set([...MY_CATEGORY_COLORS, ...myState.customColors])];
                const body = '<div class="my-editor-label">' + (editing.isBook ? '名稱' : '類別名稱') + '</div>'
                  + '<input class="field-input" id="myNameInput" maxlength="24" value="' + esc(editing.name) + '" />'
                  + '<div class="field-label">圖示</div><div class="my-icon-grid">'
                  + iconChoices.map((icon) => '<button class="my-icon-choice ' + (editing.icon === icon ? 'active' : '') + '" aria-label="選取圖示" data-my-action="select-icon" data-my-target="' + target + '" data-category-id="' + esc(editing.id) + '" data-icon-key="' + icon + '">' + myCategorySvg(icon) + '</button>').join('')
                  + '</div><div class="field-label">顏色</div><div class="my-color-row">'
                  + colorChoices.map((color) => '<button class="my-color-choice ' + (editing.color === color ? 'active' : '') + '" aria-label="選取顏色" style="background:' + color + '" data-my-action="select-color" data-my-target="' + target + '" data-category-id="' + esc(editing.id) + '" data-color="' + color + '"></button>').join('')
                  + '</div><div class="my-custom-color"><span>新增顏色</span><input id="myCustomColor" type="color" value="#1a9b9e" aria-label="自訂顏色" /><button type="button" data-my-action="add-custom-color" data-my-target="' + target + '" data-category-id="' + (editing.isBook ? '' : esc(editing.id)) + '">加入</button></div>'
                  + '<div class="my-sheet-actions"><button class="my-sheet-action" data-my-action="save-name" data-my-target="' + target + '" data-category-id="' + (editing.isBook ? '' : esc(editing.id)) + '">儲存</button>'
                  + (editing.isBook ? '' : '<button class="my-sheet-action danger" data-my-action="delete-category" data-category-id="' + esc(editing.id) + '">刪除類別</button>') + '</div>';
                openMySheet(editing.isBook ? '帳本設定' : '編輯類別', body);
              };
            }

            // Persist the overview hero choice in the same local settings object
            // used by the approved Demo, and expose it in 「我的 → 帳本設定」.
            if (typeof myState === 'object' && myState) {
              myState.overviewMode = myState.overviewMode === 'net' ? 'net' : 'credit';
              saveMyState();
            }
            const appearanceRow = document.getElementById('myAppearance');
            if (appearanceRow && !document.getElementById('myOverviewMode')) {
              const modeRow = document.createElement('button');
              modeRow.type = 'button';
              modeRow.className = 'my-row';
              modeRow.id = 'myOverviewMode';
              modeRow.innerHTML = '<span class="my-row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V6m8 12V3m8 15V9"/><path d="M2.5 18h19"/></svg></span><span class="my-row-label">總覽顯示</span><span class="my-row-value" id="myOverviewModeValue"></span><span class="my-row-chevron">›</span>';
              appearanceRow.insertAdjacentElement('afterend', modeRow);
            }
            const modeLabel = () => myState.overviewMode === 'net' ? '淨資產模式' : '信用卡模式';
            const syncModeRow = () => {
              const value = document.getElementById('myOverviewModeValue');
              if (value) value.textContent = modeLabel();
            };
            const applyOverviewMode = () => {
              const net = myState.overviewMode === 'net';
              ovVariantA.style.display = net ? '' : 'none';
              ovVariantB.style.display = net ? 'none' : '';
              btnHeroVariantA.classList.toggle('active', net);
              btnHeroVariantB.classList.toggle('active', !net);
              renderOverview();
              syncModeRow();
            };
            applyOverviewMode();
            // The approved Demo initializes the asset/liability indicator
            // before this phone entry point adds its mobile viewport. Re-read
            // the active option after the mobile layout settles so the first
            // visit cannot retain the old desktop-width pill.
            const syncOverviewSegmented = () => {
              const active = ovSegmented?.querySelector(':scope > .seg-opt.active');
              if (!active || typeof ovOptRect !== 'function') return;
              const rect = ovOptRect(active);
              ovPillX.set(rect.x);
              ovPillW.set(rect.w);
              ovSegPill.style.left = rect.x + 'px';
              ovSegPill.style.width = rect.w + 'px';
            };
            syncOverviewSegmented();
            requestAnimationFrame(() => requestAnimationFrame(syncOverviewSegmented));
            window.addEventListener('resize', syncOverviewSegmented, { passive:true });
            document.getElementById('myOverviewMode')?.addEventListener('click', () => {
                const options = ['credit','net'].map((value) => '<button class="my-setting-option ' + (myState.overviewMode === value ? 'active' : '') + '" data-phone-overview-mode="' + value + '"><span>' + (value === 'net' ? '淨資產模式' : '信用卡模式') + '</span><span class="check">' + (myState.overviewMode === value ? '✓' : '') + '</span></button>').join('');
                openMySheet('總覽顯示', options);
            });
            mySheet.addEventListener('click', (event) => {
              const button = event.target.closest?.('[data-phone-overview-mode]');
              if (!button) return;
              myState.overviewMode = button.dataset.phoneOverviewMode === 'net' ? 'net' : 'credit';
              saveMyState();
              applyOverviewMode();
              closeMySheet();
              showToast(myState.overviewMode === 'net' ? '總覽已切換為淨資產模式' : '總覽已切換為信用卡模式');
            });
          })();
        `;
        doc.body.appendChild(settingsScript);

        // The approved Demo is intentionally a desktop-preview document and
        // has no viewport meta tag. Add the mobile viewport only in this
        // standalone phone entry point; the approved source stays untouched.
        if (!doc.head.querySelector('meta[name="viewport"]')) {
          const viewport = doc.createElement('meta');
          viewport.name = 'viewport';
          viewport.content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
          doc.head.appendChild(viewport);
        } else {
          doc.head.querySelector('meta[name="viewport"]').content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
        }

        // Read the actual outer safe-area values once and expose them to the
        // same-origin Demo iframe. The bottom value is diagnostic only: the
        // visible capsule remains at its fixed 16px anchor, so safe-area
        // clearance cannot silently lift it a second time.
        const readPhoneSafeArea = () => {
          const probe = document.createElement('div');
          probe.style.cssText = 'position:absolute;inset:auto 0 0 0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none;';
          document.body.appendChild(probe);
          const computed = getComputedStyle(probe);
          const top = Number.parseFloat(computed.paddingTop) || 0;
          const bottom = Number.parseFloat(computed.paddingBottom) || 0;
          probe.remove();
          doc.documentElement.style.setProperty('--phone-safe-top', `${top}px`);
          doc.documentElement.dataset.phoneSafeBottom = String(bottom);
        };
        readPhoneSafeArea();
        window.addEventListener('resize', readPhoneSafeArea, { passive:true });

        const shell = doc.querySelector('.device-screen');
        const outerSafeZone = doc.querySelector('.safe-zone');
        // 五個主分頁都使用相同的閒置液態玻璃導覽列，不因頁面長短而漏套用。
        const longPageIds = new Set(['pageOverview', 'pageAccounts', 'pageAnalysis', 'pageList', 'pageMe']);
        let activePageId = '';
        let navIdleTimer = 0;
        const clearNavIdleTimer = () => {
          if (navIdleTimer) window.clearTimeout(navIdleTimer);
          navIdleTimer = 0;
        };
        const wakeBottomNavigation = () => {
          outerSafeZone?.classList.remove('nav-idle');
          clearNavIdleTimer();
          if (!longPageIds.has(activePageId)) return;
          navIdleTimer = window.setTimeout(() => {
            if (!outerSafeZone?.classList.contains('phone-sheet-open')) {
              outerSafeZone?.classList.add('nav-idle');
            }
          }, 2600);
        };
        const bindScrollBoundaryGuard = (scrollRoot) => {
          if (!scrollRoot || scrollRoot.dataset.phoneBoundaryGuardBound === 'true') return;
          scrollRoot.dataset.phoneBoundaryGuardBound = 'true';
          let startY = null;
          const reset = () => { startY = null; };
          scrollRoot.addEventListener('touchstart', (event) => {
            if (event.touches.length !== 1) return;
            startY = event.touches[0].clientY;
          }, { passive:true });
          scrollRoot.addEventListener('touchmove', (event) => {
            if (startY == null || event.touches.length !== 1) return;
            // Keep native controls, drag-to-reorder rows, and the capsule's
            // own taps untouched; this guard only absorbs edge rubber-band.
            if (event.target.closest?.('input, textarea, select, button, a, .reorder-row, .tabbar')) return;
            const deltaY = event.touches[0].clientY - startY;
            const atTop = scrollRoot.scrollTop <= 0;
            const atBottom = scrollRoot.scrollTop + scrollRoot.clientHeight >= scrollRoot.scrollHeight - 1;
            if ((atTop && deltaY > 0) || (atBottom && deltaY < 0)) event.preventDefault();
          }, { passive:false });
          scrollRoot.addEventListener('touchend', reset, { passive:true });
          scrollRoot.addEventListener('touchcancel', reset, { passive:true });
        };
        const bindBottomNavigationActivity = (scrollRoot) => {
          if (!scrollRoot || scrollRoot.dataset.phoneNavActivityBound === 'true') return;
          scrollRoot.dataset.phoneNavActivityBound = 'true';
          scrollRoot.addEventListener('scroll', wakeBottomNavigation, { passive:true });
          bindScrollBoundaryGuard(scrollRoot);
        };
        ['pointerdown', 'touchstart', 'wheel', 'keydown', 'focusin'].forEach((type) => {
          doc.addEventListener(type, wakeBottomNavigation, { capture:true, passive:type === 'touchstart' });
        });
        const updatePhoneSurface = () => {
          if (!shell) return;
          const activePage = doc.querySelector('.phone > .screen.visible');
          const pageId = activePage?.id || '';
          const surface = activePage?.id === 'pageOverview'
            ? 'overview'
            : activePage?.id === 'pageMe'
              ? 'me'
              : 'neutral';
          shell.dataset.phoneSurface = surface;
          doc.querySelector('.phone')?.setAttribute('data-phone-page', pageId);
          bindBottomNavigationActivity(doc.querySelector('.phone'));
          if (pageId !== activePageId) {
            activePageId = pageId;
            wakeBottomNavigation();
          }

          // Best-effort browser/PWA chrome hint. The safe-area surface above
          // remains the visual source of truth when Safari does not live-update
          // theme-color while switching tabs.
          const themeColor = surface === 'overview'
            ? '#1a9b9e'
            : surface === 'me'
              ? '#44adb5'
              : '#eef1f2';
          const themeMeta = document.querySelector('meta[name="theme-color"]');
          themeMeta?.setAttribute('content', themeColor);
        };
        updatePhoneSurface();
        const combinedMutationRoot = doc.body || doc.documentElement;
        if (combinedMutationRoot && typeof combinedMutationRoot.nodeType === 'number') {
          try {
            new MutationObserver(updatePhoneSurface).observe(combinedMutationRoot, {
              subtree: true,
              attributes: true,
              attributeFilter: ['class'],
            });
          } catch {
            // Tab clicks still call updatePhoneSurface through the existing
            // activity hooks; mutation observation is only a convenience.
          }
        }
        // Keep the top safe-area surface correct even in browsers that delay
        // or skip iframe class mutations while a tab switch is animating.
        doc.getElementById('tabbar')?.addEventListener('click', () => {
          window.requestAnimationFrame(updatePhoneSurface);
        }, { passive:true });

        // The details page is an approved, same-origin Demo iframe. When its
        // transaction sheet opens, hide only the outer phone nav so it cannot
        // cover the sheet's save controls. The approved Demo files remain
        // unchanged; this behavior belongs exclusively to phone-demo.html.
        const detailsFrame = doc.getElementById('detailsApprovedFrame');
        if (detailsFrame) {
          // Add a phone-entry cache key to the nested approved details Demo as
          // well. Safari may otherwise keep the previous iframe response even
          // after the outer phone URL receives a new rev query.
          const detailsSrc = new URL(detailsFrame.getAttribute('src') || 'details-demo.html?embed=1', frame.src);
          detailsSrc.searchParams.set('phoneRev', 'latest');
          if (detailsFrame.src !== detailsSrc.href) detailsFrame.src = detailsSrc.href;
        }
        let detailsObserver;
        const installTransactionSwipe = () => {
          const detailsDoc = detailsFrame?.contentDocument;
          const sheet = detailsDoc?.querySelector('#addSheet');
          if (!sheet || sheet.dataset.phoneSwipeBound === 'true') return;
          sheet.dataset.phoneSwipeBound = 'true';
          sheet.style.touchAction = 'pan-y';

          let startY = 0;
          let dragging = false;
          const resetSheet = () => {
            if (!dragging) return;
            dragging = false;
            sheet.classList.remove('phone-swipe-dragging');
            sheet.style.transform = '';
          };

          sheet.addEventListener('touchstart', (event) => {
            if (!sheet.classList.contains('open') || sheet.scrollTop > 0) return;
            if (event.target.closest('input, textarea, select, button, a')) return;
            startY = event.touches[0].clientY;
            dragging = false;
          }, { passive: true });

          sheet.addEventListener('touchmove', (event) => {
            if (!sheet.classList.contains('open') || !startY) return;
            const distance = event.touches[0].clientY - startY;
            if (distance <= 0) return;
            event.preventDefault();
            dragging = true;
            sheet.classList.add('phone-swipe-dragging');
            sheet.style.transform = `translateY(${distance}px)`;
          }, { passive: false });

          sheet.addEventListener('touchend', () => {
            if (!dragging) { startY = 0; return; }
            const distance = Number.parseFloat(sheet.style.transform.match(/[0-9.]+/)?.[0] || '0');
            const cancelButton = detailsDoc.getElementById('cancelTransaction');
            startY = 0;
            if (distance >= 96) {
              cancelButton?.click();
              sheet.classList.remove('phone-swipe-dragging');
              sheet.style.transform = '';
              dragging = false;
              return;
            }
            resetSheet();
          }, { passive: true });
          sheet.addEventListener('touchcancel', () => { startY = 0; resetSheet(); }, { passive: true });
        };
        const applyDetailsPhoneStyles = () => {
          const detailsDoc = detailsFrame?.contentDocument;
          if (!detailsDoc?.head || detailsDoc.head.querySelector('style[data-phone-details]')) return;
          const detailsStyle = detailsDoc.createElement('style');
          detailsStyle.dataset.phoneDetails = 'true';
          detailsStyle.textContent = `
            html.embedded, html.embedded body, html.embedded .device,
            html.embedded .screen, html.embedded .phone { background:var(--bg) !important; }
            html.embedded .phone { padding-top:0 !important; padding-bottom:84px !important; }
            html.embedded .sticky-top { background:var(--bg) !important; }
            /* The standalone details Demo reserves 62px for its own fake
               status bar. In the embedded phone entry that bar is hidden, so
               both search implementations must use the compact app header. */
            html.embedded .search-page { background:var(--card) !important; }
            html.embedded .search-page.open,
            html.embedded .details-search.open {
              animation:phone-search-slide .28s cubic-bezier(.2,.8,.2,1) !important;
            }
            @keyframes phone-search-slide { from { opacity:1; transform:translateY(-12px); } to { opacity:1; transform:none; } }
            html.embedded .search-top,
            html.embedded .details-search-top {
              box-sizing:border-box !important;
              height:158px !important;
              padding:78px 16px 28px !important;
              background:var(--accent) !important;
            }
            html.embedded, html.embedded body, html.embedded .device, html.embedded .screen, html.embedded .phone, html.embedded button, html.embedded a, html.embedded label, html.embedded .details-tx, html.embedded .details-category-row { -webkit-user-select:none !important; user-select:none !important; -webkit-touch-callout:none !important; }
            html.embedded input, html.embedded textarea, html.embedded select, html.embedded [contenteditable="true"] { -webkit-user-select:text !important; user-select:text !important; -webkit-touch-callout:default !important; }
            html.embedded .summary-card {
              appearance:none !important;
              -webkit-appearance:none !important;
              color:var(--text) !important;
            }
            html.embedded #addSheet.phone-swipe-dragging { transition:none !important; }
          `;
          detailsDoc.head.appendChild(detailsStyle);
          const detailsViewport = detailsDoc.head.querySelector('meta[name="viewport"]');
          if (detailsViewport) {
            detailsViewport.content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
          }
          installTransactionSwipe();
          bindBottomNavigationActivity(detailsDoc.querySelector('.phone'));
        };
        const syncDetailsSheetState = () => {
          const detailsDoc = detailsFrame?.contentDocument;
          applyDetailsPhoneStyles();
          const sheetOpen = Boolean(detailsDoc?.querySelector('#addSheet.open'));
          outerSafeZone?.classList.toggle('phone-sheet-open', sheetOpen);
          const searchOpen = Boolean(detailsDoc?.querySelector('#searchPage.open, #detailsSearch.open'));
          doc.getElementById('pageList')?.classList.toggle('phone-search-open', searchOpen);
          if (!sheetOpen) wakeBottomNavigation();
        };
        const observeDetailsSheet = () => {
          const detailsDoc = detailsFrame?.contentDocument;
          if (!detailsDoc?.body) return;
          applyDetailsPhoneStyles();
          detailsObserver?.disconnect();
          syncDetailsSheetState();
          const detailsMutationRoot = detailsDoc.body || detailsDoc.documentElement;
          if (detailsMutationRoot && typeof detailsMutationRoot.nodeType === 'number') {
            try {
              detailsObserver = new MutationObserver(syncDetailsSheetState);
              detailsObserver.observe(detailsMutationRoot, {
                subtree: true,
                attributes: true,
                attributeFilter: ['class'],
              });
            } catch {
              detailsObserver = undefined;
            }
          }
        };
        detailsFrame?.addEventListener('load', observeDetailsSheet);
        observeDetailsSheet();
      } catch (err) {
        error.style.display = 'block';
        frame.style.display = 'none';
      }
    });
  </script>
</body>
</html>
