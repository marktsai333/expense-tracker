    .account-control{display:none;width:100%;min-height:44px;border:0;border-radius:11px;background:var(--input-bg);padding:0 12px;color:var(--text);align-items:center;justify-content:space-between;font:600 14px inherit;text-align:left}.account-control span:last-child{color:var(--muted)}html:not(.ios) .native-select-wrap{display:none}html:not(.ios) .account-control{display:flex}.picker-backdrop{position:absolute;z-index:31;inset:0;display:none;background:rgba(15,24,28,.28);backdrop-filter:blur(2px)}.picker-backdrop.open{display:block}.account-sheet{position:absolute;z-index:32;right:8px;bottom:8px;left:8px;display:none;border-radius:22px;background:color-mix(in srgb,var(--card) 94%,transparent);box-shadow:0 16px 45px rgba(0,0,0,.22);overflow:hidden;backdrop-filter:blur(24px) saturate(145%)}.account-sheet.open{display:block;animation:sheet .32s cubic-bezier(.2,.8,.2,1)}.account-head{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:52px;padding:0 8px;border-bottom:1px solid var(--border)}.account-head h3{margin:0;text-align:center;font-size:16px;font-weight:700}.account-head button{border:0;background:none;color:var(--accent);font:600 14px inherit}.account-choice{width:100%;height:52px;border:0;border-bottom:1px solid var(--border);background:transparent;padding:0 18px;color:var(--text);display:flex;align-items:center;justify-content:space-between;font:500 15px inherit;text-align:left}.account-choice:last-child{border-bottom:0}.account-choice .check{opacity:0;color:var(--accent);font-size:18px;font-weight:700}.account-choice.active .check{opacity:1}
    .today-action{min-width:42px;height:34px;border:0;border-radius:10px;background:var(--accent-soft);padding:0 8px;color:var(--accent);font:700 12px inherit}.today-action[hidden]{display:none}
    .suggestions{display:grid;gap:6px;overflow:visible}.suggestion-card{display:grid;grid-template-columns:minmax(0,1fr) 31px 31px;border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden}.suggestion{min-width:0;border:0;border-radius:0;background:transparent;padding:8px 10px}.suggestion-tools{border:0;border-left:1px solid var(--border);background:transparent;color:var(--muted);font:600 14px inherit}.suggestion-tools.pinned{color:var(--accent)}.suggestion-reason{color:var(--accent);font-weight:700}.search-category-result,.search-result{width:100%;border:0;background:transparent;color:var(--text);text-align:left;cursor:pointer}.search-category-result{display:flex;align-items:center;justify-content:space-between;border-radius:12px;background:var(--accent-soft);padding:11px 12px;color:var(--accent);font:700 14px inherit}.search-category-result span:last-child{font-size:12px;font-weight:600}.search-result:active,.search-category-result:active{opacity:.65}
    /* 僅供 combined demo 內嵌：保留已簽核明細頁本身的所有畫面與互動，移除它自己的手機外框與底部導覽。 */
    html.embedded,html.embedded body{min-height:100%;height:100%;overflow:hidden;background:transparent}

    html.embedded .device{width:100%;height:100%;margin:0;padding:0;border-radius:0;background:transparent;box-shadow:none}
    html.embedded .screen{border-radius:0}
    html.embedded .phone{padding-top:0;padding-bottom:100px}
    html.embedded .sticky-top{padding-top:0}
